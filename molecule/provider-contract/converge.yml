---
- name: Validate the fake normalized registry
  ansible.builtin.import_playbook: >-
    ../../playbooks/container-ci/shared/validate-registry.yaml
  vars:
    s2i_ci_output_dir: >-
      {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/.tmp/molecule/provider-contract/zuul-output

- name: Prepare exact cleanup fixtures
  hosts: builder
  gather_facts: false
  vars:
    s2i_test_repo_root: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
    s2i_test_root: "{{ s2i_test_repo_root }}/.tmp/molecule/provider-contract"
    s2i_test_status_dir: "{{ s2i_test_root }}/zuul-output/.s2i-ci-status"
    s2i_test_images:
      - registry.test:5000/openstack/openstack-base:test
      - registry.test:5000/openstack/openstack-watcher-base:test
    s2i_ci_container_repo: "{{ s2i_test_repo_root }}"
    s2i_ci_selected_images:
      - base
      - cyborg/cyborg
      - watcher/watcher-base
    s2i_ci_image_mappings:
      cyborg/cyborg:
        - futureCyborgImage

  tasks:
    - name: Initialize metadata expansion fixtures
      ansible.builtin.set_fact:
        s2i_ci_effective_image_mappings: {}
        s2i_ci_mapping_sources: {}

    - name: Load tracked image mappings
      ansible.builtin.include_tasks: >-
        {{ s2i_test_repo_root }}/playbooks/container-ci/shared/load-image-mappings.yaml

    - name: Expand tracked and inventory image metadata
      ansible.builtin.include_tasks: >-
        {{ s2i_test_repo_root }}/playbooks/container-ci/shared/image-metadata-item.yaml
      loop: "{{ s2i_ci_selected_images }}"
      loop_control:
        loop_var: s2i_ci_image

    - name: Validate effective deployment key ownership
      ansible.builtin.include_tasks: >-
        {{ s2i_test_repo_root }}/playbooks/container-ci/shared/validate-deployment-keys.yaml

    - name: Require tracked and replacement metadata expansion
      ansible.builtin.assert:
        that:
          - s2i_ci_effective_image_mappings['base'] == []
          - s2i_ci_effective_image_mappings['cyborg/cyborg'] ==
              ['futureCyborgImage']
          - s2i_ci_effective_image_mappings['watcher/watcher-base'] | length == 3
          - s2i_ci_mapping_sources['cyborg/cyborg'] == 'inventory'
          - s2i_ci_mapping_sources['watcher/watcher-base'] == 'tracked'

    - name: Initialize exact reference expansion fixtures
      ansible.builtin.set_fact:
        s2i_ci_target_references:
          base: registry.test:5000/openstack/openstack-base:test
          cyborg/cyborg: registry.test:5000/openstack/openstack-cyborg:test
          watcher/watcher-base: >-
            registry.test:5000/openstack/openstack-watcher-base:test
        s2i_ci_custom_container_images: {}

    - name: Expand exact metadata references
      ansible.builtin.include_tasks: >-
        {{ s2i_test_repo_root }}/playbooks/container-ci/shared/deployment-map-item.yaml
      loop: "{{ s2i_ci_selected_images }}"
      loop_control:
        loop_var: s2i_ci_image

    - name: Require consolidated Watcher reference expansion
      ansible.builtin.assert:
        that:
          - s2i_ci_custom_container_images.watcherAPIImage ==
              s2i_ci_target_references['watcher/watcher-base']
          - s2i_ci_custom_container_images.watcherApplierImage ==
              s2i_ci_target_references['watcher/watcher-base']
          - s2i_ci_custom_container_images.watcherDecisionEngineImage ==
              s2i_ci_target_references['watcher/watcher-base']
          - s2i_ci_custom_container_images.futureCyborgImage ==
              s2i_ci_target_references['cyborg/cyborg']

    - name: Create the content status fixture directory
      ansible.builtin.file:
        path: "{{ s2i_test_status_dir }}"
        state: directory
        mode: "0755"

    - name: Publish the building content status document
      vars:
        s2i_ci_status_dir: "{{ s2i_test_status_dir }}"
        s2i_ci_content_status:
          status: building
          registry: registry.test:5000
          namespace: openstack
          tag: test
          stream: master
      ansible.builtin.include_tasks: >-
        {{ s2i_test_repo_root }}/playbooks/container-ci/shared/publish-content-status.yaml

    - name: Read the building content status document
      ansible.builtin.slurp:
        src: "{{ s2i_test_status_dir }}/content.json"
      register: s2i_test_building_document

    - name: Require the building content status document
      ansible.builtin.assert:
        that:
          - >-
            {{ s2i_test_building_document.content | b64decode | from_json ==
               {
                 'status': 'building',
                 'registry': 'registry.test:5000',
                 'namespace': 'openstack',
                 'tag': 'test',
                 'stream': 'master'
               } }}
        fail_msg: The building content status document is malformed

    - name: Publish the ready content status document
      vars:
        s2i_ci_status_dir: "{{ s2i_test_status_dir }}"
        s2i_ci_content_status:
          status: ready
          registry: registry.test:5000
          namespace: openstack
          tag: test
          stream: master
          selected_images: "{{ s2i_ci_selected_images }}"
          images: "{{ s2i_ci_target_references.values() | list }}"
          custom_container_images: "{{ s2i_ci_custom_container_images }}"
      ansible.builtin.include_tasks: >-
        {{ s2i_test_repo_root }}/playbooks/container-ci/shared/publish-content-status.yaml

    - name: Read the ready content status document
      ansible.builtin.slurp:
        src: "{{ s2i_test_status_dir }}/content.json"
      register: s2i_test_ready_document

    - name: Require the ready content status document
      ansible.builtin.assert:
        that:
          - >-
            {{ s2i_test_ready_document.content | b64decode | from_json ==
               {
                 'status': 'ready',
                 'registry': 'registry.test:5000',
                 'namespace': 'openstack',
                 'tag': 'test',
                 'stream': 'master',
                 'selected_images': s2i_ci_selected_images,
                 'images': s2i_ci_target_references.values() | list,
                 'custom_container_images': s2i_ci_custom_container_images
               } }}
        fail_msg: The ready content status document is malformed

    - name: Read fake container storage after registry validation
      ansible.builtin.slurp:
        src: "{{ s2i_test_root }}/state.json"
      register: s2i_test_state_data

    - name: Decode fake container storage
      ansible.builtin.set_fact:
        s2i_test_state: >-
          {{ s2i_test_state_data.content | b64decode | from_json }}

    - name: Add exact workflow tags to both storage clients
      ansible.builtin.copy:
        dest: "{{ s2i_test_root }}/state.json"
        mode: "0600"
        content: |
          {{ s2i_test_state |
             combine({
               'podman': s2i_test_state.podman + s2i_test_images,
               'buildah': s2i_test_images
             }) | to_nice_json }}

    - name: Write intended exact cleanup metadata
      ansible.builtin.copy:
        dest: >-
          {{ s2i_test_root }}/zuul-output/logs/container-build/intended-images.json
        mode: "0644"
        content: |
          {{ {
               'registry': 'registry.test:5000',
               'namespace': 'openstack',
               'images': s2i_test_images,
               'selected_images': ['base', 'watcher/watcher-base'],
               'target': 'watcher/watcher-base'
             } | to_nice_json }}

- name: Exercise exact shared cleanup
  ansible.builtin.import_playbook: >-
    ../../playbooks/container-ci/shared/cleanup-images.yaml
  vars:
    s2i_ci_output_dir: >-
      {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/.tmp/molecule/provider-contract/zuul-output

---
- project:
    name: openstack-k8s-operators/s2i-openstack-containers
    github-check:
      jobs:
        - s2i-openstack-containers-molecule:
            irrelevant-files: &irrelevant-for-zuul
              - ^.github/.*
              - ^docs/.*
              - ^.*\.md$
              - ^LICENSE.*$
        - s2i-openstack-container-content-provider:
            irrelevant-files: *irrelevant-for-zuul
        - s2i-openstack-container-consumer-smoke:
            irrelevant-files: *irrelevant-for-zuul
            dependencies:
              - s2i-openstack-container-content-provider
        - s2i-openstack-deploy-validation:
            irrelevant-files: *irrelevant-for-zuul
            dependencies:
              - s2i-openstack-container-content-provider
              - s2i-openstack-container-consumer-smoke
        - watcher-s2i-tempest:
            required-projects:
              - name: openstack-k8s-operators/s2i-openstack-containers
                override-checkout: main
              - name: openstack-k8s-operators/watcher-operator
                override-checkout: main
            vars:
              content_provider_registry_ip: '{{ s2i_content_provider_registry_ip }}'
            files:
              - ^containers/watcher/
              - ^containers/base/
            dependencies:
              - s2i-openstack-container-content-provider
              - s2i-openstack-container-consumer-smoke

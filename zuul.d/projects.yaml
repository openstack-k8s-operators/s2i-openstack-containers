---
- project:
    name: openstack-k8s-operators/s2i-openstack-containers
    templates:
      - barbican-operator-s2i-component-jobs
      - cinder-operator-s2i-component-jobs
      - glance-operator-s2i-component-jobs
      - horizon-operator-s2i-component-jobs
      - ironic-operator-s2i-component-jobs
      - keystone-operator-s2i-component-jobs
      - manila-operator-s2i-component-jobs
      - neutron-operator-s2i-component-jobs
      - nova-operator-s2i-component-jobs
      - swift-operator-s2i-component-jobs
      - watcher-operator-s2i-component-jobs
    github-check:
      jobs:
        - s2i-openstack-containers-molecule:
            irrelevant-files: &irrelevant-for-zuul
              - ^.github/.*
              - ^docs/.*
              - ^.*\.md$
              - ^LICENSE.*$
        - s2i-openstack-container-content-provider:
            irrelevant-files: *irrelevant-for-zuul
            nodeset: s2i-openstack-containers-image-builder
        - s2i-openstack-container-consumer-smoke:
            irrelevant-files: *irrelevant-for-zuul
            dependencies:
              - s2i-openstack-container-content-provider
        - s2i-openstack-deploy-validation:
            irrelevant-files: *irrelevant-for-zuul
            dependencies:
              - s2i-openstack-container-content-provider
              - s2i-openstack-container-consumer-smoke
        - watcher-operator-validation-master:
            # DNM: force CS10 EDPM nodes back to SELinux enforcing so this
            # debug run reproduces the live/cold migration failure instead
            # of being masked by ci-framework's permissive workaround
            # (be36d12c). Depends on ci-framework#4261 for the override var.
            vars:
              cifmw_hook_fetch_compute_facts_edpm_selinux_mode: enforcing

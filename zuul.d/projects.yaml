---
- project:
    name: openstack-k8s-operators/s2i-openstack-containers
    github-check:
      jobs:
        - s2i-openstack-containers-molecule:
            irrelevant-files: &irrelevant-for-zuul
              - ^.github/.*
              - ^docs/.*
              - ^.*\.md$
              - ^LICENSE.*$
        - s2i-openstack-container-content-provider:
            irrelevant-files: *irrelevant-for-zuul
            vars:
              # Pin staged OpenDev clones to sources.txt on this repo's
              # github-check only. Operator children must not inherit this.
              s2i_ci_prefer_shas: true
        - s2i-openstack-container-consumer-smoke:
            irrelevant-files: *irrelevant-for-zuul
            dependencies:
              - s2i-openstack-container-content-provider
        - s2i-openstack-deploy-validation:
            irrelevant-files: *irrelevant-for-zuul
            voting: false
            dependencies:
              - s2i-openstack-container-content-provider
              - s2i-openstack-container-consumer-smoke

---
- project:
    name: openstack-k8s-operators/s2i-openstack-containers
    github-check:
      jobs:
        - s2i-openstack-containers-molecule:
            irrelevant-files: &documentation-only
              - ^docs/.*
              - ^.*\.md$
              - ^LICENSE.*$
        - s2i-openstack-container-content-provider:
            irrelevant-files: *documentation-only
        - s2i-openstack-container-consumer-smoke:
            irrelevant-files: *documentation-only
            dependencies:
              - s2i-openstack-container-content-provider

---
# Job definitions for s2i-openstack-containers.
# Pattern mirrors data-plane-adoption: jobs here, layout in jobs-layout.yaml.
# Parent/nodeset come from the RDO tenant (ci-framework provides both).

- job:
    name: s2i-openstack-containers-tox
    parent: tox
    description: |
      Run repository tests (update-sources contract + s2i_build role mocks).
    vars:
      tox_envlist: test

- job:
    name: s2i-openstack-containers-build-base
    parent: cifmw-base-minimal
    abstract: true
    description: |
      Abstract base: stage Zuul checkouts into containers/*/src via pre.yaml,
      then invoke build.sh through the s2i_build role.
    timeout: 7200
    # UBI 10 builds; nodeset defined in openstack-k8s-operators/ci-framework.
    nodeset: centos-stream-10
    roles:
      - zuul: github.com/openstack-k8s-operators/s2i-openstack-containers
    required-projects:
      - github.com/openstack-k8s-operators/s2i-openstack-containers
      - github.com/openstack-k8s-operators/ci-framework
    pre-run: playbooks/pre.yaml
    run: playbooks/run.yaml
    vars:
      s2i_build_stream: master
      s2i_build_registry: localhost
      s2i_build_namespace: openstack
      s2i_build_tag: master-latest
      s2i_build_push: false
      s2i_build_action: build
      s2i_build_include_base: true
      s2i_build_targets:
        - all

- job:
    name: s2i-openstack-containers-build-provider
    parent: s2i-openstack-containers-build-base
    description: |
      Build all images from this repository (provider-style).
    vars:
      s2i_build_targets:
        - all

- job:
    name: s2i-openstack-containers-build-watcher
    parent: s2i-openstack-containers-build-base
    description: |
      Build watcher images, overlaying the Zuul checkout of openstack/watcher
      into containers/watcher/src/watcher/.
    required-projects:
      - opendev.org/openstack/watcher
    vars:
      s2i_build_targets:
        - watcher
      s2i_build_sources:
        - name: watcher
          project: opendev.org/openstack/watcher
          dest: containers/watcher/src/watcher

- job:
    name: s2i-openstack-containers-build-cyborg
    parent: s2i-openstack-containers-build-base
    description: |
      Build cyborg images, overlaying the Zuul checkout of openstack/cyborg
      into containers/cyborg/src/cyborg/.
    required-projects:
      - opendev.org/openstack/cyborg
    vars:
      s2i_build_targets:
        - cyborg
      s2i_build_sources:
        - name: cyborg
          project: opendev.org/openstack/cyborg
          dest: containers/cyborg/src/cyborg

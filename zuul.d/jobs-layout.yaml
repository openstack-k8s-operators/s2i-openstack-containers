---
# Project pipeline layout (same pattern as data-plane-adoption).
# Repo must be listed in the RDO tenant (SF zuul/main.yaml) and
# review.rdoproject.org config (system-required).
- project:
    name: openstack-k8s-operators/s2i-openstack-containers
    github-check:
      jobs:
        - noop
        - s2i-openstack-containers-tox
        # First real build exercise: watcher + source overlay via pre.yaml.
        # Non-voting until the build is proven stable on RDO nodes.
        - s2i-openstack-containers-build-watcher:
            voting: false

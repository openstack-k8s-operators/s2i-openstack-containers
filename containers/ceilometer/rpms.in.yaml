contentOrigin:
  repofiles:
    - ./rpms.repo
context:
  bare: true

#
# To update rpms.lock.yaml:
#    rpm-lockfile-prototype rpms.in.yaml
#

arches:
  - x86_64
  - aarch64

packages:
  - gcc
  - gcc-c++
  - git-core
  - ipmitool
  - libffi-devel
  - libxml2-devel
  - libxslt-devel
  - openssl-devel
  - python3-devel
  - python3-libvirt
  - python3-setuptools
  - python3-wheel

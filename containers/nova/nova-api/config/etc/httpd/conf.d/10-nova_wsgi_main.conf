# NOTE: authored for this repo, not sourced from upstream nova or the RDO
# spec. Unlike keystone/glance/cinder, nova's source tree ships no httpd/
# directory and no wsgi wrapper scripts (release note "remove-wsgi-scripts"
# removed the old console-script-based nova-api-wsgi/nova-metadata-wsgi
# binaries). This vhost config was authored against nova.wsgi.osapi_compute's
# init_application() factory (see nova/wsgi/osapi_compute.py) and has not
# been verified against a real deployment yet — treat as a first draft to
# validate/correct during this week's build, not a known-good reference.

Listen 8774

<VirtualHost *:8774>
  WSGIDaemonProcess osapi_compute processes=2 threads=1 user=nova group=nova display-name=%{GROUP}
  WSGIProcessGroup osapi_compute
  WSGIScriptAlias / /var/www/cgi-bin/nova/nova-api-wsgi.py
  WSGIApplicationGroup %{GLOBAL}
  WSGIPassAuthorization On
  ErrorLog /var/log/nova/nova-api.log
  CustomLog /var/log/nova/nova-api-access.log combined
  <Directory /var/www/cgi-bin/nova>
    Require all granted
  </Directory>
</VirtualHost>

Listen 8775

<VirtualHost *:8775>
  WSGIDaemonProcess metadata processes=2 threads=1 user=nova group=nova display-name=%{GROUP}
  WSGIProcessGroup metadata
  WSGIScriptAlias / /var/www/cgi-bin/nova/nova-metadata-wsgi.py
  WSGIApplicationGroup %{GLOBAL}
  WSGIPassAuthorization On
  ErrorLog /var/log/nova/nova-metadata.log
  CustomLog /var/log/nova/nova-metadata-access.log combined
  <Directory /var/www/cgi-bin/nova>
    Require all granted
  </Directory>
</VirtualHost>

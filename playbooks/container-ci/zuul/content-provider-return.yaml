---
- name: Return selective image metadata and pause the provider
  zuul_return:
    data:
      zuul:
        pause: true
      s2i_ci_content:
        registry: "{{ s2i_ci_public_registry_endpoint }}"
        registry_host: "{{ s2i_ci_registry.public_host }}"
        registry_port: "{{ s2i_ci_registry.public_port }}"
        namespace: "{{ s2i_ci_namespace }}"
        tag: "{{ s2i_ci_tag }}"
        target: "{{ s2i_ci_target_expression }}"
        stream: "{{ s2i_ci_stream }}"
        selected_images: "{{ s2i_ci_selected_images }}"
        images: "{{ s2i_ci_published_images }}"
        image_mappings: "{{ s2i_ci_effective_image_mappings }}"
        mapping_sources: "{{ s2i_ci_mapping_sources }}"
        custom_container_images: "{{ s2i_ci_custom_container_images }}"
      # Namespaced as s2i_content_provider_* to avoid colliding with the
      # standard openstack-k8s-operators content provider's variables when
      # both run as parents of the same consumer job.  For standalone use
      # (s2i provider only), consumers reference these directly.
      s2i_content_provider_os_custom_container_images: >-
        {{ s2i_ci_custom_container_images }}
      # Intentional string sentinel -- consumers test `!= "null"` or check
      # s2i_content_provider_registry_available instead.  Cannot be actual
      # null because Zuul zuul_return merges dicts and null would not
      # override a parent job's existing value.
      s2i_content_provider_os_registry_url: "null"
      s2i_content_provider_os_registry_namespace: ""
      s2i_content_provider_os_registry_tag: ""
      s2i_content_provider_dlrn_md5_hash: ""
      s2i_content_provider_gating_repo_available: false
      s2i_content_provider_gating_repo_url: ""
      s2i_content_provider_registry_available: true
      s2i_content_provider_registry_ip: "{{ s2i_ci_registry.public_host }}"
      s2i_content_provider_registry_ip_port: >-
        {{ s2i_ci_public_registry_endpoint }}
      s2i_content_provider_status_url: >-
        http://{{ s2i_ci_registry.public_host }}:{{ s2i_ci_status_port
        | default(8080) }}/content.json
      s2i_cifmw_build_images_output: {}

---
# Stage Zuul-checked-out source repositories into container build contexts.
#
# Zuul clones upstream repos into the workspace. This task file copies those
# checkouts into the container src/ directories so build.sh uses them instead
# of cloning from the network. When s2i_ci_prefer_shas is true (s2i-repo
# jobs only), staged repos are checked out at the sources.txt pin unless
# the project has a speculative change in the Zuul queue. Never set
# prefer_shas on speculative OpenDev builds.
#
# It delegates all sources.txt parsing to `build.sh list-sources`, keeping
# build.sh as the single source of truth for the source manifest format.
#
# Required facts (set by the caller before including this):
#   s2i_ci_container_repo  - path to the s2i-openstack-containers checkout
#   s2i_ci_stream          - stream name (e.g. "master")
#   s2i_ci_workspace_root  - Zuul workspace root
#   s2i_ci_resolved_images - register from `build.sh resolve`
#
# Optional:
#   s2i_ci_prefer_shas     - checkout sources.txt SHAs after staging (default false)

# list-sources emits URL paths (`openstack/tempest`). zuul.projects is
# keyed by canonical names (`opendev.org/openstack/tempest`). Map both
# forms, plus Zuul `project.name`, so checkouts stage reliably.
- name: Map sources.txt project paths to Zuul canonical names
  ansible.builtin.set_fact:
    s2i_ci_zuul_name_map: {}

- name: Add canonical, short, and Zuul name keys to the map
  ansible.builtin.set_fact:
    s2i_ci_zuul_name_map: >-
      {{ s2i_ci_zuul_name_map | combine({
           item.key: item.key,
           (item.key | regex_replace('^[^/]+/', '')): item.key,
           (item.value.name | default(item.key)): item.key
         }) }}
  loop: "{{ zuul.projects | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Collect Zuul project names for source matching
  ansible.builtin.set_fact:
    s2i_ci_zuul_project_names: "{{ s2i_ci_zuul_name_map | list }}"
    s2i_ci_staged_projects: []

# Match list-sources paths (openstack/tempest) and Zuul canonical names
# (opendev.org/openstack/tempest) so Depends-On / speculative OpenDev
# changes skip the sources.txt pin checkout.
- name: Collect project paths with speculative Zuul changes
  ansible.builtin.set_fact:
    s2i_ci_speculative_projects: >-
      {{
        (
          (
            (zuul['items'] | default([]))
            | selectattr('project', 'defined')
            | map(attribute='project')
            | map(attribute='name', default='')
            | select('ne', '')
            | list
          )
          +
          (
            (zuul['items'] | default([]))
            | selectattr('project', 'defined')
            | map(attribute='project')
            | map(attribute='canonical_name', default='')
            | select('ne', '')
            | list
          )
        ) | unique | list
      }}

- name: Resolve Zuul requirements checkout when available
  when: "'openstack/requirements' in s2i_ci_zuul_name_map"
  ansible.builtin.set_fact:
    s2i_ci_requirements_src: >-
      {{ s2i_ci_workspace_root }}/{{
         zuul.projects[s2i_ci_zuul_name_map['openstack/requirements']].src_dir }}

- name: Query source dependencies for each image target
  ansible.builtin.command:
    argv:
      - "{{ s2i_ci_container_repo }}/build.sh"
      - list-sources
      - "{{ item }}"
      - "{{ s2i_ci_stream }}"
  args:
    chdir: "{{ s2i_ci_container_repo }}"
  loop: "{{ s2i_ci_resolved_images.stdout.split() }}"
  register: s2i_ci_source_queries
  changed_when: false
  failed_when: false

- name: Build unified source placement list
  ansible.builtin.set_fact:
    s2i_ci_source_placements: >-
      {{ s2i_ci_source_queries.results
         | selectattr('stdout_lines', 'defined')
         | map(attribute='stdout_lines')
         | flatten
         | unique
         | list }}

- name: Stage each Zuul-available source into its build context
  ansible.builtin.include_tasks: stage-zuul-source-sync.yaml
  loop: >-
    {{ s2i_ci_source_placements
       | map('split', '|')
       | selectattr('1', 'in', s2i_ci_zuul_project_names)
       | list }}
  loop_control:
    loop_var: s2i_ci_src
    label: "{{ s2i_ci_src[0] }} ({{ s2i_ci_src[1] }})"

name: Setup Python and tox
description: Install tox with the repository's canonical Python 3.12

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.12"

    - name: Install tox
      shell: bash
      run: python3 -m pip install tox

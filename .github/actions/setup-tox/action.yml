name: Setup Python and tox
description: Install tox with the repository's canonical Python 3.12

runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: "3.15"

    - name: Install tox
      shell: bash
      run: python3 -m pip install tox

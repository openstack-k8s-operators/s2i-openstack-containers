name: Tests (source reproducibility)

on:
  pull_request:
    paths:
      - .github/actions/setup-tox/action.yml
      - .github/workflows/test-update-sources.yml
      - build.sh
      - containers/**
      - tox.ini
      - '!**/OWNERS'
      - '!**/OWNERS_ALIASES'
  push:
    paths:
      - .github/actions/setup-tox/action.yml
      - .github/workflows/test-update-sources.yml
      - build.sh
      - containers/**
      - tox.ini
      - '!**/OWNERS'
      - '!**/OWNERS_ALIASES'
  workflow_dispatch:

jobs:
  update-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-tox

      - name: Regenerate from committed source pins
        run: tox -e update-lockfiles

      - name: Require reproducible generated files
        run: git diff --exit-code -- containers/

      - name: Preserve frozen source references
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frozen-source-refs
          path: .tmp/source-maintenance/frozen-source-refs.master.tsv
          if-no-files-found: ignore

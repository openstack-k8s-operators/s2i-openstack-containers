name: Build from source

on: [workflow_dispatch, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PIP_NO_BINARY: ":all:"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/detect-changed-services
        id: changes
      - uses: ./.github/actions/setup-tox
        if: steps.changes.outputs.services != ''

      - name: Install system dependencies
        if: steps.changes.outputs.services != ''
        run: sudo apt-get update && sudo apt-get install -y buildah podman

      - name: Build changed services from source
        if: steps.changes.outputs.services != ''
        run: tox -e custom -- build ${{ steps.changes.outputs.services }}

[tox]
envlist = linters,update-sources,build,test
skipsdist = true

[testenv]
base_python = 3.12
passenv =
    STREAM
    REGISTRY
    NAMESPACE
    TAG
    IMAGE_PREFIX
    BASE_IMAGE
    CONSTRAINTS_FILE
    BUILD_CONSTRAINTS_FILE
    DEFAULT_STREAM
    SKIP_HASH_UPDATE
    PIP_NO_BINARY
    REGISTRY_AUTH_FILE
    PARALLEL
    BUILD_LOGS_DIR
    UPDATE_LOCKFILES_TARGETS
# pin to pip==26.1.2 as 26.2 has broken pip-tools
# pin pip-tools==7.6.0: pybuild-deps 0.5.0 passes generate_hashes to
# OutputWriter which was removed in pip-tools 7.6.1
deps =
    pip-tools==7.6.0
    pybuild-deps==0.5.0
    pip==26.1.2
allowlist_externals =
    bash

[testenv:linters]
description = Lint all Containerfiles with pre-commit (hadolint)
deps =
    pre-commit>=3.0.0
commands =
    pre-commit run --all-files --show-diff-on-failure {posargs}

[testenv:update-sources]
description = Refresh source pins and generated lockfiles
setenv =
    XDG_CACHE_HOME = {envtmpdir}/cache
commands_pre =
    python -c "import sys; assert sys.version_info[:2] == (3, 12), 'dependency generation requires Python 3.12'"
commands =
    bash -c "rm -f {env:XDG_CACHE_HOME}/pybuild-deps/find-build-deps"
    bash {toxinidir}/build.sh update-sources {posargs:all}

[testenv:update-lockfiles]
description = Refresh generated lockfiles without advancing source pins
setenv =
    XDG_CACHE_HOME = {envtmpdir}/cache
    SKIP_HASH_UPDATE = 1
commands_pre =
    {[testenv:update-sources]commands_pre}
commands =
    bash -c "rm -f {env:XDG_CACHE_HOME}/pybuild-deps/find-build-deps"
    bash {toxinidir}/build.sh update-sources {posargs:all}

[testenv:build]
commands =
    bash {toxinidir}/build.sh build {posargs:all}

[testenv:test]
commands =
    bash {toxinidir}/tests/test_update_sources.sh

[testenv:custom]
commands =
    bash {toxinidir}/build.sh {posargs}

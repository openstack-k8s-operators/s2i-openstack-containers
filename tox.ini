[tox]
envlist = linters,update-sources,build,test
skipsdist = true
toxworkdir = {toxinidir}/.tmp/tox

[testenv]
base_python = 3.12
setenv =
    PYTHONPYCACHEPREFIX = {toxinidir}/.tmp/python-cache
passenv =
    STREAM
    REGISTRY
    NAMESPACE
    TAG
    IMAGE_PREFIX
    BASE_IMAGE
    CONSTRAINTS_FILE
    BUILD_CONSTRAINTS_FILE
    DEFAULT_STREAM
    SKIP_HASH_UPDATE
    PIP_NO_BINARY
    REGISTRY_AUTH_FILE
    REGISTRY_CERT_DIR
    PARALLEL
    BUILD_LOGS_DIR
    UPDATE_LOCKFILES_TARGETS
# pin to pip==26.1.2 as 26.2 has broken pip-tools
# pin pip-tools==7.6.0: pybuild-deps 0.5.0 passes generate_hashes to
# OutputWriter which was removed in pip-tools 7.6.1
deps =
    pip-tools==7.6.0
    pybuild-deps==0.5.0
    pip==26.1.2
allowlist_externals =
    bash

[testenv:linters]
description = Run formatting and style checks through pre-commit
deps =
    pre-commit>=3.0.0
skip_install = true
setenv =
    PYTHONPYCACHEPREFIX = {toxinidir}/.tmp/python-cache
    PRE_COMMIT_HOME = {toxinidir}/.tmp/pre-commit
    ANSIBLE_HOME = {toxinidir}/.tmp/ansible/home
    ANSIBLE_COLLECTIONS_PATH = {toxinidir}/.tmp/ansible/collections
    ANSIBLE_LOCAL_TEMP = {toxinidir}/.tmp/ansible/local-tmp
commands =
    pre-commit run -a --show-diff-on-failure

[testenv:molecule]
description = Exercise provider registry and cleanup contracts with Molecule
deps =
    ansible-core==2.18.7
    molecule==26.6.0
setenv =
    PYTHONPYCACHEPREFIX = {toxinidir}/.tmp/python-cache
    MOLECULE_EPHEMERAL_DIRECTORY = {toxinidir}/.tmp/molecule/ephemeral/{envname}
    ANSIBLE_HOME = {toxinidir}/.tmp/ansible/home
    ANSIBLE_COLLECTIONS_PATH = {toxinidir}/.tmp/ansible/collections
    ANSIBLE_LOCAL_TEMP = {toxinidir}/.tmp/ansible/local-tmp
    ANSIBLE_ROLES_PATH = {toxinidir}/.tmp/ansible/roles
commands =
    molecule reset -s provider-contract
    molecule test -s provider-contract

[testenv:update-sources]
description = Refresh source pins and generated lockfiles
setenv =
    XDG_CACHE_HOME = {toxworkdir}/cache
commands_pre =
    python -c "import sys; assert sys.version_info[:2] == (3, 12), 'dependency generation requires Python 3.12'"
    python -c "import pathlib; pathlib.Path('{env:XDG_CACHE_HOME}/pybuild-deps').mkdir(parents=True, exist_ok=True)"
commands =
    bash -c "rm -f {env:XDG_CACHE_HOME}/pybuild-deps/find-build-deps"
    bash {toxinidir}/build.sh update-sources {posargs:all}

[testenv:update-lockfiles]
description = Refresh generated lockfiles without advancing source pins
setenv =
    XDG_CACHE_HOME = {toxworkdir}/cache
commands_pre =
    {[testenv:update-sources]commands_pre}
commands =
    bash -c "rm -f {env:XDG_CACHE_HOME}/pybuild-deps/find-build-deps"
    bash {toxinidir}/build.sh update-lockfiles {posargs:all}

[testenv:build]
platform = linux
commands =
    bash {toxinidir}/build.sh build {posargs:all}

[testenv:test]
commands =
    bash {toxinidir}/tests/test_update_sources.sh
    bash {toxinidir}/tests/test_build.sh
    bash {toxinidir}/tests/test_auto_detect.sh

[testenv:custom]
commands =
    bash {toxinidir}/build.sh {posargs}

[flake8]
select = H
ignore = H404,H405
show-source = true
exclude = .git,.tmp,.tox,.venv
